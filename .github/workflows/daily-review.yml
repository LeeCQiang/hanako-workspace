name: Hanako Daily Review
on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 生成复盘
        run: |
          DATE=$(date -u '+%Y-%m-%d')
          mkdir -p reviews
          [ -f "reviews/${DATE}.md" ] || cat > "reviews/${DATE}.md" << EOF
# 复盘 ${DATE}
> 自动生成

昨日运行状态: 正常
EOF
      - name: 推送
        run: |
          git config user.name "Hanako Bot"
          git config user.email "hanako-bot@lee-cqiang.dev"
          git add reviews/ 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || \
            git commit -m "review: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase && git push
