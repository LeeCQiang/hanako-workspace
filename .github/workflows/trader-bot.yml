name: Hanako Trading Bot

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 运行交易监控
        env:
          AI_TRADER_TOKEN: ${{ secrets.AI_TRADER_TOKEN }}
        run: python scripts/trader-bot.py
      - name: 提交日志
        run: |
          git config user.name "Hanako Bot"
          git config user.email "hanako-bot@lee-cqiang.dev"
          git add bot-state.json bot-log.jsonl 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || \
            git commit -m "bot: auto checkpoint $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
